<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- No deploy, / vira o caminho do site (ex.: /PlantaFacil/ ou /). Assim os arquivos carregam em qualquer URL errada. -->
<base href="/">
<title>404 · Planta fácil</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11131C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311131C'/%3E%3Cpath d='M7 25V7h18v18z' fill='none' stroke='%239DB1EA' stroke-width='2'/%3E%3Cpath d='M7 17h9v8' fill='none' stroke='%23EAA94E' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = 'escuro';
    try {
      var p = localStorage.getItem('plantafacil:tema') || 'auto';
      t = p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro') : p;
    } catch (e) { /* sem armazenamento */ }
    document.documentElement.dataset.tema = t;
  })();
</script>
<link rel="stylesheet" href="style.css?v=e3e51924f2">
<style>
  body.p404 { overflow: auto; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 24px;
    background-image: linear-gradient(var(--linha) 1px, transparent 1px), linear-gradient(90deg, var(--linha) 1px, transparent 1px);
    background-size: 40px 40px; background-position: center; }
  .nf { display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 380px; padding: 28px 24px 26px;
    background: var(--bg); border: 1px solid var(--linha2); border-radius: 18px; }
  .nf h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
  .nf p { margin: 0; color: var(--fg2); }
  .nf .btn { width: auto; padding: 0 22px; margin-top: 6px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; border: 1px solid var(--btn); border-radius: 10px; transition: filter var(--motion-fast); }
  .nf .btn:hover { filter: brightness(1.05); } .nf .btn:active { filter: brightness(.92); }
  .desenho { width: 240px; height: auto; overflow: visible; }
  .parede { fill: none; stroke: var(--fg2); stroke-width: 6; stroke-linecap: square; stroke-dasharray: 300; stroke-dashoffset: 300;
    animation: tracar 900ms var(--ease-out, ease-out) forwards; }
  .parede.b { animation-delay: 700ms; } .parede.c { animation-delay: 1400ms; }
  .falta { fill: none; stroke: var(--acento); stroke-width: 2; stroke-dasharray: 5 6; opacity: 0; animation: surgir 400ms ease 2200ms forwards, marchar 1.2s linear 2200ms infinite; }
  .no { fill: var(--acento); opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 360ms var(--ease-spring, ease-out) forwards; }
  .no.a { animation-delay: 2300ms; } .no.b { animation-delay: 2400ms; }
  .num { font: 500 30px var(--mono); fill: var(--fg3); opacity: 0; animation: surgir 500ms ease 500ms forwards; }
  .nf > :not(.desenho) { animation: subir 500ms var(--ease-out, ease-out) both; }
  .nf > .rot { animation-delay: 2300ms; } .nf > h1 { animation-delay: 2400ms; } .nf > p { animation-delay: 2500ms; } .nf > .btn { animation-delay: 2600ms; }
  @keyframes tracar { to { stroke-dashoffset: 0; } }
  @keyframes surgir { to { opacity: 1; } }
  @keyframes marchar { to { stroke-dashoffset: -22; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .parede, .falta, .no, .num, .nf > :not(.desenho) { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
  }
</style>
</head>
<body class="p404">
<main class="nf">
  <svg class="desenho" viewBox="0 0 240 150" role="img" aria-label="Planta de um cômodo com uma parede faltando">
    <path class="parede a" d="M30 122V30"/>
    <path class="parede b" d="M30 30H210"/>
    <path class="parede c" d="M210 30V122"/>
    <path class="falta" d="M30 122H210"/>
    <rect class="no a" x="25" y="117" width="10" height="10"/>
    <rect class="no b" x="205" y="117" width="10" height="10"/>
    <text class="num" x="120" y="86" text-anchor="middle">404</text>
  </svg>
  <p class="rot">Erro 404</p>
  <h1>Essa parede não existe.</h1>
  <p>O endereço que você abriu não faz parte da Planta fácil. Seus projetos continuam salvos neste navegador.</p>
  <a class="btn primario" href="./">Voltar para a Planta fácil</a>
</main>
</body>
</html>
